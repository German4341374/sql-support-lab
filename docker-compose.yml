name: sql-support-lab

services:
  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_lab}
      POSTGRES_USER: ${POSTGRES_USER:-support_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_lab_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-support_lab} -d ${POSTGRES_DB:-support_lab}
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
